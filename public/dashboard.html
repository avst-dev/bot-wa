<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVST Bot Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --avst-purple: #6f42c1; --avst-light: #f4f0ff; }
        body { background: #f8f9fa; font-family: 'Inter', sans-serif; padding-bottom: 50px; }
        .navbar { background: white !important; border-bottom: 2px solid var(--avst-light); }
        .navbar-brand { font-weight: 800; color: var(--avst-purple) !important; }
        .bot-card { background: white; border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(111, 66, 193, 0.05); }
        .qr-section { background: var(--avst-light); border-radius: 15px; padding: 20px; display: none; text-align: center; margin-top: 15px; }
        .qr-section img { max-width: 180px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); background: white; }
        .status-badge { font-size: 0.75rem; font-weight: 700; padding: 5px 12px; border-radius: 20px; transition: 0.3s; }
        .status-online { background: #d1fae5; color: #059669; }
        .status-offline { background: #fee2e2; color: #dc2626; }
        .status-connecting { background: #e3f2fd; color: #0d6efd; }
    </style>
</head>
<body>
<nav class="navbar sticky-top">
    <div class="container">
        <a class="navbar-brand" href="#"><i class="fas fa-bolt me-2"></i>AVST MANAGER</a>
        <a href="/" class="btn btn-sm btn-outline-danger px-3 rounded-pill">Logout</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card bot-card p-4">
                <h5 class="fw-bold mb-3">Tambah Bot Baru</h5>
                <input type="text" id="botIdInput" class="form-control rounded-pill mb-3" placeholder="Contoh: bot-01">
                <button onclick="createNewBot()" class="btn btn-primary w-100 rounded-pill fw-bold" style="background: var(--avst-purple); border: none;">Generate Bot</button>
            </div>
        </div>
        <div class="col-md-8">
            <div id="botList" class="row g-3"></div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    // Ambil data awal saat dashboard dibuka
    fetch('/api/active-bots')
        .then(res => res.json())
        .then(data => data.forEach(bot => appendBotCard(bot.botId, bot.status)));

    function createNewBot() {
        const botId = document.getElementById('botIdInput').value.trim();
        if(!botId) return alert("Isi ID-nya dulu");
        fetch('/api/create-bot', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ botId })
        }).then(() => {
            document.getElementById('botIdInput').value = '';
            appendBotCard(botId, true);
        });
    }

    function appendBotCard(botId, status) {
        if(document.getElementById(`card-${botId}`)) return;
        const html = `
            <div class="col-12" id="card-${botId}">
                <div class="card bot-card p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <div class="rounded-circle bg-light p-3 me-3"><i class="fas fa-robot text-purple" style="color: var(--avst-purple)"></i></div>
                            <div>
                                <h6 class="fw-bold mb-0">${botId}</h6>
                                <span id="label-${botId}" class="status-badge ${status ? 'status-online' : 'status-offline'}">
                                    ${status ? 'Connected & Active' : 'Disabled'}
                                </span>
                            </div>
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="switch-${botId}" ${status ? 'checked' : ''} onchange="toggleBot('${botId}', this.checked)">
                            </div>
                            <button onclick="deleteBot('${botId}')" class="btn btn-link text-muted p-0"><i class="fas fa-trash-can"></i></button>
                        </div>
                    </div>
                    <div id="qr-container-${botId}" class="qr-section">
                        <div id="qr-${botId}"></div>
                    </div>
                </div>
            </div>`;
        document.getElementById('botList').insertAdjacentHTML('afterbegin', html);
    }

    // LISTENER SOCKET (Agar tidak perlu refresh manual)
    socket.on('bot_connected', (data) => {
        const label = document.getElementById(`label-${data.botId}`);
        const qrContainer = document.getElementById(`qr-container-${data.botId}`);
        if(label) {
            label.innerText = 'Connected & Active';
            label.className = 'status-badge status-online';
        }
        if(qrContainer) qrContainer.style.display = 'none';
    });

    socket.on('qr_update', (data) => {
        const container = document.getElementById(`qr-container-${data.botId}`);
        const qrBox = document.getElementById(`qr-${data.botId}`);
        const isChecked = document.getElementById(`switch-${data.botId}`).checked;
        const label = document.getElementById(`label-${data.botId}`);

        if(container && isChecked) {
            container.style.display = 'block';
            qrBox.innerHTML = `<img src="${data.qr}" alt="QR">`;
            if(label && label.innerText !== 'Connected & Active') {
                label.innerText = 'Waiting Scan...';
                label.className = 'status-badge status-connecting';
            }
        }
    });

    function toggleBot(botId, status) {
        const label = document.getElementById(`label-${botId}`);
        const container = document.getElementById(`qr-container-${botId}`);
        
        if(!status) {
            container.style.display = 'none';
            label.innerText = 'Disabled';
            label.className = 'status-badge status-offline';
        } else {
            label.innerText = 'Connecting...';
            label.className = 'status-badge status-connecting';
        }

        fetch('/api/toggle-bot', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ botId, status })
        });
    }

    function deleteBot(botId) {
        if(!confirm(`Hapus bot "${botId}"?`)) return;
        fetch(`/api/delete-bot/${botId}`, { method: 'DELETE' })
            .then(() => document.getElementById(`card-${botId}`).remove());
    }
</script>
</body>
</html>
